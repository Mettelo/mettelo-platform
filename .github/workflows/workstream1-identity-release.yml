name: Workstream 1 Identity Release Contract

on:
  pull_request:
    paths:
      - 'app/auth/**'
      - 'app/signin/**'
      - 'app/onboarding/**'
      - 'app/member/account/**'
      - 'app/api/member-identity/**'
      - 'app/api/profile/**'
      - 'app/api/account-preferences/**'
      - 'app/api/member-discovery/**'
      - 'app/api/member-collaboration-invitations/**'
      - 'components/MemberAccountSettings.tsx'
      - 'components/OnboardingFlow.tsx'
      - 'lib/member-identity.ts'
      - 'lib/member-readiness.ts'
      - 'lib/account-preferences.ts'
      - 'lib/notifications.ts'
      - 'supabase/migrations/**'
      - 'scripts/audit-workstream-1.mjs'
      - 'scripts/workstream1-populated-upgrade.sql'
      - 'tests/workstream1-identity-security-e2e.spec.ts'
      - 'tests/project-experience-phase2-account.spec.ts'
      - '.github/workflows/workstream1-identity-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-contract:
    name: Workstream 1 static contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify Workstream 1 architecture and security invariants
        run: node scripts/audit-workstream-1.mjs
      - run: npm run lint
      - run: npm run typecheck
      - name: Verify existing recovery contract
        run: node scripts/audit-member-account-recovery.mjs
      - name: Verify existing recovery Playwright contract
        run: npx playwright test tests/member-account-recovery-contract.spec.ts --project=chromium

  local-security-and-migration:
    name: Workstream 1 local security, migration and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI_LOCAL_SUPABASE: '1'
      E2E_BASE_URL: http://127.0.0.1:3000
      E2E_MEMBER_EMAIL: member.e2e@example.test
      E2E_MEMBER_PASSWORD: local-e2e-member-password
      E2E_ARCHITECT_EMAIL: architect.e2e@example.test
      E2E_ARCHITECT_PASSWORD: local-e2e-architect-password
      E2E_ADMIN_EMAIL: admin.e2e@example.test
      E2E_ADMIN_PASSWORD: local-e2e-admin-password
      PRODUCTION_SUPABASE_URL: https://aconptuqupsgznyrxhrh.supabase.co
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0
      - name: Prepare isolated Supabase migration set
        run: node scripts/prepare-local-supabase.mjs
      - name: Start isolated Supabase stack
        shell: bash
        run: |
          set -euo pipefail
          supabase stop --workdir .supabase-ci --no-backup >/dev/null 2>&1 || true
          supabase start --workdir .supabase-ci -x studio,imgproxy,logflare,vector,supavisor
      - name: Export isolated Supabase credentials
        shell: bash
        run: |
          set -euo pipefail
          supabase status --workdir .supabase-ci -o env > /tmp/supabase.env
          set -a
          source /tmp/supabase.env
          set +a
          echo "::add-mask::$SERVICE_ROLE_KEY"
          echo "::add-mask::$DB_URL"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "E2E_SUPABASE_URL=$API_URL"
            echo "E2E_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "E2E_SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "E2E_SUPABASE_DB_URL=$DB_URL"
          } >> "$GITHUB_ENV"
      - name: Seed populated local identities and history fixtures
        run: node scripts/setup-local-e2e.mjs
      - name: Install PostgreSQL client for migration preservation proof
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Prove populated upgrade preserves profile, application, membership and Proof history
        shell: bash
        run: psql "$E2E_SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f scripts/workstream1-populated-upgrade.sql
      - name: Start Mettelo against isolated Supabase
        shell: bash
        run: |
          npm run dev -- --hostname 127.0.0.1 > /tmp/mettelo-w1.log 2>&1 &
          echo $! > /tmp/mettelo-w1.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/signin > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/mettelo-w1.log
          exit 1
      - name: Verify canonical identity, concurrency, RLS and privacy boundaries
        run: npx playwright test tests/workstream1-identity-security-e2e.spec.ts --project=chromium --workers=1
      - name: Verify Account IA, 320px, 200 percent reflow and owner-scoped preferences
        run: npx playwright test tests/project-experience-phase2-account.spec.ts --project=chromium --workers=1
      - name: Verify Phase 18 discovery and invitation preference regression
        run: npx playwright test tests/project-experience-phase18a-member-invitations-e2e.spec.ts tests/project-experience-phase18c-governance-e2e.spec.ts --project=chromium --workers=1
      - name: Upload Workstream 1 failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: workstream1-release-evidence-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
            /tmp/mettelo-w1.log
            .supabase-ci/manifest.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop isolated Supabase stack
        if: always()
        run: supabase stop --workdir .supabase-ci --no-backup
