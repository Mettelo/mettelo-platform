name: Workstream 7 Phase 19 Release Contract

on:
  pull_request:
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'supabase/migrations/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package*.json'
      - '.github/workflows/workstream7-release.yml'
  push:
    branches:
      - workstream7-phase19-completion-final-review
  workflow_dispatch:

concurrency:
  group: ws7-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-contract:
    name: Workstream 7 static and cross-phase contract
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record exact source
        run: |
          git rev-parse HEAD > /tmp/workstream7-head.txt
          git archive --format=tar.gz --output=/tmp/workstream7-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: workstream7-source-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/workstream7-head.txt
            /tmp/workstream7-source.tar.gz
          retention-days: 3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install Playwright Chromium for browser-backed compatibility checks
        run: npx playwright install chromium
      - run: npm run lint
      - run: npm run typecheck
      - name: Phase 19 and Phase 20-22 compatibility
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: artifacts/ws7-static.json
        run: >-
          npx playwright test
          tests/project-experience-phase19-completion-operational-ux.spec.ts
          tests/project-experience-phase20-proof-operational-verification.spec.ts
          tests/project-experience-phase21-admin-collaboration-policy.spec.ts
          tests/project-experience-phase22-release-acceptance.spec.ts
          --project=chromium --workers=1 --retries=0 --reporter=line,json
      - name: Reject missing failed skipped or flaky tests
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const report=JSON.parse(readFileSync('artifacts/ws7-static.json','utf8'));
          const stats=report.stats;
          if(!stats||stats.expected<1||stats.unexpected||stats.skipped||stats.flaky||report.errors?.length){
            throw new Error(`WS7 static contract is not green: ${JSON.stringify(stats)}`);
          }
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workstream7-static-results-${{ github.run_attempt }}
          path: artifacts/ws7-static.json
          if-no-files-found: error
          retention-days: 7

  runtime-contract:
    name: Workstream 7 isolated completion runtime
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI_LOCAL_SUPABASE: '1'
      E2E_BASE_URL: http://127.0.0.1:3000
      E2E_MEMBER_EMAIL: member.e2e@example.test
      E2E_MEMBER_PASSWORD: local-e2e-member-password
      E2E_ARCHITECT_EMAIL: architect.e2e@example.test
      E2E_ARCHITECT_PASSWORD: local-e2e-architect-password
      E2E_ADMIN_EMAIL: admin.e2e@example.test
      E2E_ADMIN_PASSWORD: local-e2e-admin-password
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      PLAYWRIGHT_JSON_OUTPUT_NAME: artifacts/ws7-runtime.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: git rev-parse HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install chromium
      - uses: supabase/setup-cli@v1
        with:
          version: 2.111.0
      - run: node scripts/prepare-local-supabase.mjs
      - name: Start disposable database and apply clean migration chain
        run: supabase start --workdir .supabase-ci -x studio,imgproxy,logflare,vector,supavisor
      - name: Export disposable credentials
        shell: bash
        run: |
          set -euo pipefail
          supabase status --workdir .supabase-ci -o env > /tmp/supabase.env
          set -a
          source /tmp/supabase.env
          set +a
          echo "::add-mask::$SERVICE_ROLE_KEY"
          echo "::add-mask::$DB_URL"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "E2E_SUPABASE_URL=$API_URL"
            echo "E2E_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "E2E_SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "E2E_SUPABASE_DB_URL=$DB_URL"
          } >> "$GITHUB_ENV"
      - run: npm run build
      - run: node scripts/setup-local-e2e.mjs
      - name: Start production build
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- --hostname 127.0.0.1 > /tmp/mettelo-ws7.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/signin > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/mettelo-ws7.log
          exit 1
      - name: Phase 19 runtime security and compatibility suites
        run: >-
          npx playwright test
          tests/project-experience-phase17-rls-e2e.spec.ts
          tests/project-experience-phase18a-member-invitations-e2e.spec.ts
          tests/project-experience-phase18b-marketplace-e2e.spec.ts
          tests/project-experience-phase18c-governance-e2e.spec.ts
          tests/project-experience-phase22-anonymous-return-e2e.spec.ts
          --project=chromium --workers=1 --retries=0 --reporter=line,json
      - name: Reject missing failed skipped or flaky runtime tests
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const report=JSON.parse(readFileSync('artifacts/ws7-runtime.json','utf8'));
          const stats=report.stats;
          if(!stats||stats.expected<1||stats.unexpected||stats.skipped||stats.flaky||report.errors?.length){
            throw new Error(`WS7 runtime contract is not green: ${JSON.stringify(stats)}`);
          }
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workstream7-runtime-results-${{ github.run_attempt }}
          path: |
            artifacts/ws7-runtime.json
            test-results/
            /tmp/mettelo-ws7.log
            .supabase-ci/manifest.json
          if-no-files-found: error
          retention-days: 7
      - name: Stop disposable database
        if: always()
        run: supabase stop --workdir .supabase-ci --no-backup

  workstream7-gate:
    name: Workstream 7 release gate
    if: always()
    needs: [static-contract, runtime-contract]
    runs-on: ubuntu-latest
    steps:
      - name: Require every Workstream 7 layer
        env:
          STATIC_RESULT: ${{ needs.static-contract.result }}
          RUNTIME_RESULT: ${{ needs.runtime-contract.result }}
        run: |
          test "$STATIC_RESULT" = success
          test "$RUNTIME_RESULT" = success
