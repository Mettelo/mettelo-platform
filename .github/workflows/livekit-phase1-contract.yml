name: Event Room Phase 1-2 Contract

on:
  pull_request:
    paths:
      - 'app/api/project-events/**'
      - 'components/**'
      - 'lib/event-room-errors.ts'
      - 'tests/livekit-phase1-*.spec.ts'
      - 'tests/event-room-phase2-*.spec.ts'
      - '.github/workflows/livekit-phase1-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  event-room-contract:
    name: Event Room Phase 1-2 contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI_LOCAL_SUPABASE: '1'
      E2E_BASE_URL: http://127.0.0.1:3000
      E2E_MEMBER_EMAIL: member.e2e@example.test
      E2E_MEMBER_PASSWORD: Local-E2E-member-2026!
      E2E_ARCHITECT_EMAIL: architect.e2e@example.test
      E2E_ARCHITECT_PASSWORD: Local-E2E-architect-2026!
      E2E_ADMIN_EMAIL: admin.e2e@example.test
      E2E_ADMIN_PASSWORD: Local-E2E-admin-2026!
      PRODUCTION_SUPABASE_URL: https://aconptuqupsgznyrxhrh.supabase.co
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Blocking Phase 2 error taxonomy, retry and safe-diagnostic contracts
        run: npx playwright test tests/event-room-phase2-diagnostics.spec.ts --project=chromium --workers=1 --timeout=60000
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0
      - name: Prepare isolated Supabase migration set
        run: node scripts/prepare-local-supabase.mjs
      - name: Start isolated Supabase stack
        run: supabase start --workdir .supabase-ci -x studio,imgproxy,logflare,vector,supavisor
      - name: Export isolated Supabase credentials
        shell: bash
        run: |
          supabase status --workdir .supabase-ci -o env > /tmp/supabase.env
          set -a
          source /tmp/supabase.env
          set +a
          echo "::add-mask::$SERVICE_ROLE_KEY"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "E2E_SUPABASE_URL=$API_URL"
            echo "E2E_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "E2E_SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"
      - name: Seed disposable local identities and fixtures
        run: node scripts/setup-local-e2e.mjs
      - name: Start Mettelo with fake server-only LiveKit configuration
        shell: bash
        run: |
          LIVEKIT_URL='wss://livekit.phase1.invalid' LIVEKIT_API_KEY='phase1-ci-key' LIVEKIT_API_SECRET='phase1-ci-secret' npm run dev -- --hostname 127.0.0.1 > /tmp/mettelo-livekit-configured.log 2>&1 &
          echo $! > /tmp/mettelo-livekit.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/signin > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/mettelo-livekit-configured.log
          exit 1
      - name: Blocking configured token, permission, timing and structured diagnostic contracts
        run: npx playwright test tests/livekit-phase1-contract.spec.ts --project=chromium --workers=1 --timeout=60000
      - name: Restart Mettelo without LiveKit provider configuration
        shell: bash
        run: |
          kill "$(cat /tmp/mettelo-livekit.pid)" || true
          pkill -f "next dev --hostname 127.0.0.1" || true
          for attempt in {1..20}; do
            if ! curl --silent http://127.0.0.1:3000/signin > /dev/null; then break; fi
            sleep 1
          done
          env -u LIVEKIT_URL -u LIVEKIT_API_KEY -u LIVEKIT_API_SECRET npm run dev -- --hostname 127.0.0.1 > /tmp/mettelo-livekit-unconfigured.log 2>&1 &
          echo $! > /tmp/mettelo-livekit.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/signin > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/mettelo-livekit-unconfigured.log
          exit 1
      - name: Blocking missing-provider configuration contract
        run: npx playwright test tests/livekit-phase1-provider-config.spec.ts --project=chromium --workers=1 --timeout=60000
      - name: Upload evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: event-room-phase1-2-contract-evidence
          path: |
            playwright-report/
            test-results/
            /tmp/mettelo-livekit-configured.log
            /tmp/mettelo-livekit-unconfigured.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop services
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/mettelo-livekit.pid ]; then kill "$(cat /tmp/mettelo-livekit.pid)" || true; fi
          pkill -f "next dev --hostname 127.0.0.1" || true
          supabase stop --workdir .supabase-ci --no-backup
