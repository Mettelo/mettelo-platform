name: Workstream 2 Project Release Contract

on:
  pull_request:
    paths:
      - 'app/projects/**'
      - 'app/member/discover/**'
      - 'app/member/architect-projects/**'
      - 'app/api/project-applications/**'
      - 'app/api/admin/projects/**'
      - 'components/MemberProjectInterestFlow.tsx'
      - 'lib/project-**'
      - 'lib/member-project-**'
      - 'lib/public-project-**'
      - 'lib/member-discover-project-loader.ts'
      - 'supabase/migrations/**'
      - 'scripts/audit-workstream-2.mjs'
      - 'scripts/workstream2-populated-upgrade.sql'
      - 'tests/project-experience-phase3-governance.spec.ts'
      - 'tests/project-experience-phase4-public-security.spec.ts'
      - 'tests/project-experience-phase5-member-fit-security.spec.ts'
      - '.github/workflows/workstream2-project-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-contract:
    name: Workstream 2 static contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify Workstream 2 canonical ownership and preservation invariants
        run: node scripts/audit-workstream-2.mjs
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run audit:project-library
      - run: npm run test:project-interest-flow
      - name: Build with non-production contract values
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci.invalid.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
        run: npm run build

  local-project-contract:
    name: Workstream 2 migration, security, browser and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CI_LOCAL_SUPABASE: '1'
      E2E_BASE_URL: http://127.0.0.1:3000
      E2E_MEMBER_EMAIL: member.e2e@example.test
      E2E_MEMBER_PASSWORD: local-e2e-member-password
      E2E_ARCHITECT_EMAIL: architect.e2e@example.test
      E2E_ARCHITECT_PASSWORD: local-e2e-architect-password
      E2E_ADMIN_EMAIL: admin.e2e@example.test
      E2E_ADMIN_PASSWORD: local-e2e-admin-password
      PRODUCTION_SUPABASE_URL: https://aconptuqupsgznyrxhrh.supabase.co
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0
      - name: Prepare isolated Supabase migration set
        run: node scripts/prepare-local-supabase.mjs
      - name: Start isolated Supabase stack
        shell: bash
        run: |
          set -euo pipefail
          supabase stop --workdir .supabase-ci --no-backup >/dev/null 2>&1 || true
          supabase start --workdir .supabase-ci -x studio,imgproxy,logflare,vector,supavisor
      - name: Export isolated Supabase credentials
        shell: bash
        run: |
          set -euo pipefail
          supabase status --workdir .supabase-ci -o env > /tmp/supabase.env
          set -a
          source /tmp/supabase.env
          set +a
          echo "::add-mask::$SERVICE_ROLE_KEY"
          echo "::add-mask::$DB_URL"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "E2E_SUPABASE_URL=$API_URL"
            echo "E2E_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "E2E_SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "E2E_SUPABASE_DB_URL=$DB_URL"
          } >> "$GITHUB_ENV"
      - name: Seed populated identities and project fixtures
        run: node scripts/setup-local-e2e.mjs
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Prove populated Workstream 2 migration replay preserves history
        shell: bash
        run: psql "$E2E_SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f scripts/workstream2-populated-upgrade.sql
      - name: Start Mettelo against isolated Supabase
        shell: bash
        run: |
          npm run dev -- --hostname 127.0.0.1 > /tmp/mettelo-ws2.log 2>&1 &
          echo $! > /tmp/mettelo-ws2.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/projects > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/mettelo-ws2.log
          exit 1
      - name: Verify Phase 3 canonical governance, mobile, keyboard and 200 percent reflow
        run: npx playwright test tests/project-experience-phase3-governance.spec.ts --project=chromium --workers=1
      - name: Verify Phase 4 public-safe projection and private project/resource boundaries
        run: npx playwright test tests/project-experience-phase4-public-security.spec.ts --project=chromium --workers=1
      - name: Verify Phase 5 member RLS and active-interest uniqueness
        run: npx playwright test tests/project-experience-phase5-member-fit-security.spec.ts --project=chromium --workers=1
      - name: Verify public discovery, filtering, public detail and member-fit regressions
        run: npx playwright test tests/public-project-discovery-filter-contract.spec.ts tests/project-catalogue-filtering.spec.ts tests/project-experience-phase4-acceptance-contract.spec.ts tests/project-experience-phase5-member-fit.spec.ts tests/project-experience-v2-public-design.spec.ts --project=chromium --workers=1
      - name: Verify downstream participation and readiness consumers
        run: npx playwright test tests/project-experience-phase6-interest-submission.spec.ts tests/project-experience-phase9-participation-model.spec.ts tests/project-experience-phase-11-readiness.spec.ts --project=chromium --workers=1
      - name: Upload Workstream 2 failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: workstream2-release-evidence-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
            /tmp/mettelo-ws2.log
            .supabase-ci/manifest.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop isolated Supabase stack
        if: always()
        run: supabase stop --workdir .supabase-ci --no-backup
