name: Mettelo CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, interactions and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SITE_URL: https://mettelo.com
      NEXT_PUBLIC_SUPABASE_URL: https://aconptuqupsgznyrxhrh.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_C5OTze0onbkbLl7Lorpjcg_FX1kDL6P
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run audit:interactions
      - run: npm run audit:phase0
      - run: npm run audit:phase1
      - run: npm run audit:phase2
      - run: npm run audit:phase3
      - run: npm run audit:admin
      - run: npm run build
      - name: Upload interaction audit on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: interaction-audit
          path: artifacts/interaction-audit.*
          if-no-files-found: ignore
          retention-days: 3
