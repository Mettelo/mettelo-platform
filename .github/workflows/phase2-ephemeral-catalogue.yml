name: Phase 2 Ephemeral Catalogue SQL Rehearsal
on:
  pull_request:
    paths:
      - 'data/github-master-projects.json'
      - 'scripts/generate-isolated-catalogue-rehearsal.mjs'
      - 'scripts/preview-github-catalogue-import.mjs'
      - 'scripts/validate-github-first-catalogue.mjs'
      - 'docs/phase2b/**'
      - 'tests/fixtures/phase2-ephemeral-legacy.sql'
      - '.github/workflows/phase2-ephemeral-catalogue.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ephemeral-postgres-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: phase2_ephemeral_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d phase2_ephemeral_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: phase2_ephemeral_ci
      SOURCE_SHA: 65dc740ac1c6c8f88868863a6772150c1a5a12f7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert disposable database identity
        shell: bash
        run: |
          set -euo pipefail
          test "$PGDATABASE" = "phase2_ephemeral_ci"
          test "$PGHOST" = "localhost"
          test "$(psql -Atc 'select current_database()')" = "phase2_ephemeral_ci"
      - name: Create synthetic 305-project history and private catalogue schema
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f tests/fixtures/phase2-ephemeral-legacy.sql
          psql -v ON_ERROR_STOP=1 -f docs/phase2b/isolated-catalogue-schema.sql
      - name: Rehearse rollback-by-default (no rows persisted)
        shell: bash
        run: |
          set -euo pipefail
          node scripts/generate-isolated-catalogue-rehearsal.mjs data/github-master-projects.json "$SOURCE_SHA" > /tmp/phase2-rollback.sql
          grep -q '^ROLLBACK;' /tmp/phase2-rollback.sql
          psql -v ON_ERROR_STOP=1 -f /tmp/phase2-rollback.sql
          test "$(psql -Atc 'select count(*) from catalogue_private.projects')" = "0"
          test "$(psql -Atc 'select count(*) from catalogue_private.revisions')" = "0"
      - name: Rehearse explicit isolated commit and idempotence
        shell: bash
        run: |
          set -euo pipefail
          node scripts/generate-isolated-catalogue-rehearsal.mjs data/github-master-projects.json "$SOURCE_SHA" --commit --isolated-target-confirmed > /tmp/phase2-commit.sql
          psql -v ON_ERROR_STOP=1 -f /tmp/phase2-commit.sql
          psql -v ON_ERROR_STOP=1 -f /tmp/phase2-commit.sql
          test "$(psql -Atc 'select count(*) from catalogue_private.projects')" = "50"
          test "$(psql -Atc 'select count(*) from catalogue_private.revisions')" = "1"
      - name: Verify security and legacy preservation
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f docs/phase2b/isolated-catalogue-acceptance.sql
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $verify$
          DECLARE changed int;
          BEGIN
            SELECT count(*) INTO changed FROM (
              SELECT 'projects' AS kind,md5(string_agg(id::text,',' ORDER BY id)) AS digest FROM public.projects
              UNION ALL SELECT 'runs',md5(string_agg(id::text,',' ORDER BY id)) FROM public.project_runs
              UNION ALL SELECT 'applications',md5(string_agg(id::text,',' ORDER BY id)) FROM public.project_applications
              UNION ALL SELECT 'members',md5(string_agg(id::text,',' ORDER BY id)) FROM public.project_members
              UNION ALL SELECT 'offers',md5(string_agg(id::text,',' ORDER BY id)) FROM public.project_offers
            ) actual FULL OUTER JOIN public.phase2_ci_baseline saved USING(kind)
            WHERE actual.digest IS DISTINCT FROM saved.digest;
            IF changed<>0 THEN RAISE EXCEPTION 'Historical record IDs changed'; END IF;
          END $verify$;
          SQL
      - name: Verify transaction rollback restores staged catalogue
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          DELETE FROM catalogue_private.projects;
          DO $verify$ BEGIN
            IF (SELECT count(*) FROM catalogue_private.projects)<>0 THEN
              RAISE EXCEPTION 'Rollback fixture failed to remove staged rows';
            END IF;
          END $verify$;
          ROLLBACK;
          DO $verify$ BEGIN
            IF (SELECT count(*) FROM catalogue_private.projects)<>50 THEN
              RAISE EXCEPTION 'Rollback did not restore 50 staged rows';
            END IF;
          END $verify$;
          SQL
