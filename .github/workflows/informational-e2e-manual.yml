name: Informational E2E (on demand)
# The non-blocking informational suite no longer starts a sixth local
# Supabase stack on every PR. Run it manually when investigating journeys.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: informational-e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  informational-journeys:
    name: Informational submission journeys
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI_LOCAL_SUPABASE: '1'
      E2E_BASE_URL: http://127.0.0.1:3000
      E2E_MEMBER_EMAIL: member.e2e@example.test
      E2E_MEMBER_PASSWORD: local-e2e-member-password
      E2E_ARCHITECT_EMAIL: architect.e2e@example.test
      E2E_ARCHITECT_PASSWORD: local-e2e-architect-password
      E2E_ADMIN_EMAIL: admin.e2e@example.test
      E2E_ADMIN_PASSWORD: local-e2e-admin-password
      PRODUCTION_SUPABASE_URL: https://aconptuqupsgznyrxhrh.supabase.co
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Restore Playwright Chromium cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install or verify Playwright Chromium
        run: npx playwright install chromium
      - name: Verify Chromium launches on the hosted runner
        run: node -e "const { chromium } = require('@playwright/test'); (async () => { const browser = await chromium.launch(); await browser.close(); })().catch(error => { console.error(error); process.exit(1); });"
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0
      - name: Prepare isolated Supabase migration set
        run: node scripts/prepare-local-supabase.mjs
      - name: Start isolated Supabase stack
        shell: bash
        run: |
          set -euo pipefail
          supabase stop --workdir .supabase-ci --no-backup >/dev/null 2>&1 || true
          if ! supabase start --workdir .supabase-ci -x studio,imgproxy,logflare,vector,supavisor; then
            echo "Supabase startup failed once; resetting the local stack and retrying exactly once."
            supabase stop --workdir .supabase-ci --no-backup >/dev/null 2>&1 || true
            sleep 2
            supabase start --workdir .supabase-ci -x studio,imgproxy,logflare,vector,supavisor
          fi
      - name: Export isolated Supabase credentials
        shell: bash
        run: |
          supabase status --workdir .supabase-ci -o env > /tmp/supabase.env
          set -a
          source /tmp/supabase.env
          set +a
          echo "::add-mask::$SERVICE_ROLE_KEY"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "E2E_SUPABASE_URL=$API_URL"
            echo "E2E_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "E2E_SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"
      - name: Seed disposable local identities and fixtures
        run: node scripts/setup-local-e2e.mjs
      - name: Start Mettelo against isolated Supabase
        shell: bash
        run: |
          npm run dev -- --hostname 127.0.0.1 > /tmp/mettelo-e2e.log 2>&1 &
          echo $! > /tmp/mettelo-e2e.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/signin > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/mettelo-e2e.log
          exit 1
      - name: Verify E2E production guard
        run: npm run check:e2e-config
      - name: Run full informational submission journeys
        run: npx playwright test tests/staging-submission-journeys.spec.ts --project=chromium --workers=1
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informational-journeys-evidence-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
            /tmp/mettelo-e2e.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop isolated Supabase stack
        if: always()
        run: supabase stop --workdir .supabase-ci --no-backup
