name: Phase 3 Ephemeral Catalogue Integrity
on:
  pull_request:
    paths:
      - 'supabase/migrations/*phase3_github_project_uniqueness.sql'
      - 'supabase/migrations/*phase3_github_revision_approval.sql'
      - 'lib/expandable-github-catalogue.ts'
      - 'app/api/admin/projects/route.ts'
      - 'tests/phase3-expandable-catalogue-contract.test.mjs'
      - 'tests/phase3-expandable-catalogue.spec.ts'
      - 'tests/phase3-admin-github-import-contract.test.mjs'
      - 'lib/github-catalogue-projection.ts'
      - 'app/api/admin/projects/github-revision-approve/route.ts'
      - 'app/api/admin/projects/github-revision-preview/route.ts'
      - 'components/AdminGithubProjectReview.tsx'
      - 'package.json'
      - '.github/workflows/phase3-ephemeral-catalogue.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ephemeral-unique-constraints:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: phase3_ephemeral_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d phase3_ephemeral_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: phase3_ephemeral_ci
    steps:
      - uses: actions/checkout@v4
      - name: Verify ephemeral-only target and seed historical records
        shell: bash
        run: |
          set -euo pipefail
          test "$PGHOST" = localhost
          test "$PGDATABASE" = phase3_ephemeral_ci
          psql -v ON_ERROR_STOP=1 -f tests/fixtures/phase2-ephemeral-legacy.sql
          psql -v ON_ERROR_STOP=1 -c 'ALTER TABLE public.projects ADD COLUMN canonical_project_key text, ADD COLUMN github_url text;'
      - name: Apply reviewed uniqueness migration to disposable PostgreSQL
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261018000000_phase3_github_project_uniqueness.sql
      - name: Assert canonical ID and URL uniqueness with trailing slash and case normalisation
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -c "INSERT INTO public.projects(id,canonical_project_key,github_url) VALUES (md5('phase3-new-1')::uuid,'MTL-DE-051','https://github.com/Mettelo/data-engineering-051');"
          if psql -v ON_ERROR_STOP=1 -c "INSERT INTO public.projects(id,canonical_project_key,github_url) VALUES (md5('phase3-duplicate-id')::uuid,'MTL-DE-051','https://github.com/Mettelo/different');"; then
            echo 'FAIL: duplicate canonical ID accepted'; exit 1
          fi
          if psql -v ON_ERROR_STOP=1 -c "INSERT INTO public.projects(id,canonical_project_key,github_url) VALUES (md5('phase3-duplicate-repo')::uuid,'MTL-DE-052','https://github.com/mettelo/data-engineering-051/');"; then
            echo 'FAIL: duplicate repository URL accepted'; exit 1
          fi
          test "$(psql -Atc 'select count(*) from public.projects')" = 306
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $verify$
          DECLARE changed int;
          BEGIN
            SELECT count(*) INTO changed FROM (
              SELECT 'projects' AS kind,md5(string_agg(id::text,',' ORDER BY id)) AS digest FROM public.projects WHERE canonical_project_key IS NULL
              UNION ALL SELECT 'runs',md5(string_agg(id::text,',' ORDER BY id)) FROM public.project_runs
              UNION ALL SELECT 'applications',md5(string_agg(id::text,',' ORDER BY id)) FROM public.project_applications
              UNION ALL SELECT 'members',md5(string_agg(id::text,',' ORDER BY id)) FROM public.project_members
              UNION ALL SELECT 'offers',md5(string_agg(id::text,',' ORDER BY id)) FROM public.project_offers
            ) actual FULL OUTER JOIN public.phase2_ci_baseline saved USING(kind)
            WHERE actual.digest IS DISTINCT FROM saved.digest;
            IF changed<>0 THEN RAISE EXCEPTION 'Legacy historical identities changed'; END IF;
          END $verify$;
          SQL

      - name: Test atomic draft-only revision approval and optimistic replay rejection
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          ALTER TABLE public.projects
            ADD COLUMN title text, ADD COLUMN summary text, ADD COLUMN problem_statement text,
            ADD COLUMN status text DEFAULT 'draft', ADD COLUMN visibility text DEFAULT 'private',
            ADD COLUMN updated_at timestamptz DEFAULT now(), ADD COLUMN updated_by_user_id uuid;
          CREATE TABLE public.project_activity_log(
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(), project_id uuid NOT NULL REFERENCES public.projects(id),
            event_type text NOT NULL, actor_type text NOT NULL, actor_user_id uuid,
            from_status text, to_status text, metadata jsonb NOT NULL DEFAULT '{}',created_at timestamptz DEFAULT now()
          );
          UPDATE public.projects SET title='Old',summary='Old summary',problem_statement='Old problem'
          WHERE id=md5('phase3-new-1')::uuid;
          INSERT INTO public.project_activity_log(project_id,event_type,actor_type,metadata)
          VALUES(md5('phase3-new-1')::uuid,'project_created','system',
           jsonb_build_object('github_import',jsonb_build_object(
            'external_id','MTL-DE-051','repository','https://github.com/Mettelo/data-engineering-051',
            'revision',1,'manifest_snapshot',jsonb_build_object('id','MTL-DE-051'))));
          SQL
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261018010000_phase3_github_revision_approval.sql
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $approval$
          DECLARE new_revision int; record_count int;
          BEGIN
           SELECT public.phase3_approve_github_revision(
            md5('phase3-new-1')::uuid,md5('phase3-admin')::uuid,1,
            '{"id":"MTL-DE-051","repository":"https://github.com/Mettelo/data-engineering-051","status":"Available","name":"New title","brief":"New summary","problem":"New problem"}'::jsonb,
            'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
           ) INTO new_revision;
           IF new_revision<>2 THEN RAISE EXCEPTION 'Revision did not advance'; END IF;
           SELECT count(*) INTO record_count FROM public.project_activity_log
           WHERE event_type='github_manifest_revision_approved';
           IF record_count<>1 THEN RAISE EXCEPTION 'Revision audit missing'; END IF;
           IF (SELECT title FROM public.projects WHERE id=md5('phase3-new-1')::uuid)<>'New title'
           THEN RAISE EXCEPTION 'Draft was not updated'; END IF;
           BEGIN
            PERFORM public.phase3_approve_github_revision(
             md5('phase3-new-1')::uuid,md5('phase3-admin')::uuid,1,
             '{"id":"MTL-DE-051","repository":"https://github.com/Mettelo/data-engineering-051","status":"Available","name":"Replay","brief":"Replay","problem":"Replay"}'::jsonb,
             'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb');
            RAISE EXCEPTION 'Replay incorrectly accepted';
           EXCEPTION WHEN OTHERS THEN
            IF SQLERRM='Replay incorrectly accepted' THEN RAISE; END IF;
           END;
           UPDATE public.projects SET visibility='public' WHERE id=md5('phase3-new-1')::uuid;
           BEGIN
            PERFORM public.phase3_approve_github_revision(
             md5('phase3-new-1')::uuid,md5('phase3-admin')::uuid,2,
             '{"id":"MTL-DE-051","repository":"https://github.com/Mettelo/data-engineering-051","status":"Available","name":"Published","brief":"Published","problem":"Published"}'::jsonb,
             'cccccccccccccccccccccccccccccccccccccccc');
            RAISE EXCEPTION 'Published project incorrectly modified';
           EXCEPTION WHEN OTHERS THEN
            IF SQLERRM='Published project incorrectly modified' THEN RAISE; END IF;
           END;
          END $approval$;
          SQL
