name: Mettelo CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scope:
    name: Change scope
    runs-on: ubuntu-latest
    outputs:
      requires_staging: ${{ steps.classify.outputs.requires_staging }}
      classification: ${{ steps.classify.outputs.classification }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify release risk
        id: classify
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "push" ]; then
            before="${{ github.event.before }}"
            after="${{ github.sha }}"

            # A missing/all-zero predecessor cannot be scoped safely, so fail
            # closed and require the full authenticated backend gate.
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
              echo "requires_staging=true" >> "$GITHUB_OUTPUT"
              echo "classification=unscoped-main-push-full-release" >> "$GITHUB_OUTPUT"
              echo "Main push has no trustworthy predecessor: authenticated backend E2E is mandatory."
              exit 0
            fi

            git diff --name-only "$before" "$after" > /tmp/changed-files.txt
          else
            git diff --name-only \
              "${{ github.event.pull_request.base.sha }}" \
              "${{ github.event.pull_request.head.sha }}" > /tmp/changed-files.txt
          fi

          echo "Changed files:"
          cat /tmp/changed-files.txt

          requires_staging=false
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            case "$file" in
              docs/*.md|docs/**/*.md|*.md|.github/workflows/*.yml|.github/workflows/*.yaml)
                ;;
              *)
                requires_staging=true
                break
                ;;
            esac
          done < /tmp/changed-files.txt

          if [ "$requires_staging" = "true" ]; then
            echo "requires_staging=true" >> "$GITHUB_OUTPUT"
            echo "classification=runtime-or-backend-impact" >> "$GITHUB_OUTPUT"
            echo "Runtime/backend-impacting change: authenticated backend E2E is mandatory."
          else
            echo "requires_staging=false" >> "$GITHUB_OUTPUT"
            echo "classification=docs-or-ci-policy-only" >> "$GITHUB_OUTPUT"
            echo "Documentation/CI-policy-only change: destructive backend E2E is explicitly not required by scope."
          fi

  verify:
    name: Fast regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SITE_URL: https://mettelo.com
      NEXT_PUBLIC_SUPABASE_URL: https://aconptuqupsgznyrxhrh.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_C5OTze0onbkbLl7Lorpjcg_FX1kDL6P
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run audit:interactions
      - run: npm run audit:regression-coverage
      - run: npm run test:project-interest-flow
      - run: npm run audit:phase0
      - run: npm run audit:phase1
      - run: npm run audit:phase2
      - run: npm run audit:phase3
      - run: npm run audit:admin
      - run: npm run audit:admin2
      - run: npm run audit:phase5-reputation
      - run: npm run audit:journey-phase6
      - run: npm run audit:journey-phase7
      - run: npm run audit:journey-phase8
      - run: npm run audit:platform-resilience
      - name: Install Chromium for regression tests
        run: npx playwright install --with-deps chromium
      - run: npm run test:regression
      - run: npm run build
      - name: Upload interaction audit on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: interaction-audit
          path: artifacts/interaction-audit.*
          if-no-files-found: ignore
          retention-days: 3

  staging-e2e:
    name: Staging submission journeys
    needs: scope
    if: needs.scope.outputs.requires_staging == 'true' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
      E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      E2E_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
      E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
      E2E_MEMBER_EMAIL: ${{ secrets.E2E_MEMBER_EMAIL }}
      E2E_MEMBER_PASSWORD: ${{ secrets.E2E_MEMBER_PASSWORD }}
      E2E_ARCHITECT_EMAIL: ${{ secrets.E2E_ARCHITECT_EMAIL }}
      E2E_ARCHITECT_PASSWORD: ${{ secrets.E2E_ARCHITECT_PASSWORD }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      PRODUCTION_SUPABASE_URL: https://aconptuqupsgznyrxhrh.supabase.co
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:staging
      - name: Upload Playwright evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: staging-e2e-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  release-gate:
    name: Release gate
    if: always()
    needs: [scope, verify, staging-e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Require every regression layer required by scope
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          STAGING_RESULT: ${{ needs.staging-e2e.result }}
          REQUIRES_STAGING: ${{ needs.scope.outputs.requires_staging }}
          CLASSIFICATION: ${{ needs.scope.outputs.classification }}
        run: |
          set -euo pipefail

          if [ "$SCOPE_RESULT" != "success" ]; then
            echo "Release blocked: change-scope classification failed ($SCOPE_RESULT)."
            exit 1
          fi

          if [ "$VERIFY_RESULT" != "success" ]; then
            echo "Release blocked: fast regression gate=$VERIFY_RESULT."
            exit 1
          fi

          if [ "$REQUIRES_STAGING" = "true" ]; then
            if [ "$STAGING_RESULT" != "success" ]; then
              echo "Release blocked: classification=$CLASSIFICATION requires authenticated backend E2E, staging=$STAGING_RESULT."
              exit 1
            fi
            echo "Release gate passed: fast regression and required authenticated backend E2E are green."
          else
            if [ "$STAGING_RESULT" != "skipped" ] && [ "$STAGING_RESULT" != "success" ]; then
              echo "Release blocked: optional staging job ended unexpectedly ($STAGING_RESULT)."
              exit 1
            fi
            echo "Release gate passed: classification=$CLASSIFICATION; backend E2E is explicitly not required by scope."
          fi

  deployment-gate:
    name: Deployment gate
    needs: [scope, release-gate]
    if: always() && needs.release-gate.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Confirm release is eligible for deployment validation
        env:
          CLASSIFICATION: ${{ needs.scope.outputs.classification }}
        run: |
          echo "All required release prerequisites passed for scope=$CLASSIFICATION."
          echo "Deployment validation/promotion may run now when deployment is required by that scope."
