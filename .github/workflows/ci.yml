name: Mettelo CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: mettelo-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Change scope
    runs-on: ubuntu-latest
    outputs:
      risk: ${{ steps.scope.outputs.risk }}
      requires_staging: ${{ steps.scope.outputs.requires_staging }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify release risk
        id: scope
        shell: bash
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE_SHA" ]; then
            BASE_SHA="${{ github.event.before }}"
          fi
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="HEAD^"
          fi
          git diff --name-only "$BASE_SHA" HEAD > /tmp/changed-files.txt
          cat /tmp/changed-files.txt
          RISK=GREEN
          REQUIRES_STAGING=false
          if grep -Eq '^(supabase/|app/api/|lib/(auth|supabase|project|communications)|middleware|\.github/workflows/)' /tmp/changed-files.txt; then
            RISK=RED
            REQUIRES_STAGING=true
          elif grep -Eq '^(app/|components/|styles/)' /tmp/changed-files.txt; then
            RISK=AMBER
          fi
          echo "risk=$RISK" >> "$GITHUB_OUTPUT"
          echo "requires_staging=$REQUIRES_STAGING" >> "$GITHUB_OUTPUT"

  regression:
    name: Fast regression gate
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SITE_URL: https://mettelo.com
      NEXT_PUBLIC_SUPABASE_URL: https://aconptuqupsgznyrxhrh.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_C5OTze0onbkbLl7Lorpjcg_FX1kDL6P
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run audit:interactions
      - run: npm run audit:regression-coverage
      - run: npm run test:project-interest-flow
      - run: npm run audit:phase0
      - run: npm run audit:phase1
      - run: npm run audit:phase2
      - run: npm run audit:phase3
      - run: npm run audit:admin
      - run: npm run audit:admin2
      - run: npm run audit:phase5-reputation
      - run: npm run audit:journey-phase6
      - run: npm run audit:journey-phase7
      - run: npm run audit:journey-phase8
      - run: npm run audit:platform-resilience
      - name: Install Chromium for regression tests
        run: npx playwright install --with-deps chromium
      - run: npm run test:regression
      - run: npm run build
      - name: Upload interaction audit on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: interaction-audit
          path: artifacts/interaction-audit.*
          if-no-files-found: ignore
          retention-days: 3

  staging-e2e:
    name: Staging submission journeys
    needs: scope
    if: needs.scope.outputs.requires_staging == 'true' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI_LOCAL_SUPABASE: '1'
      E2E_BASE_URL: http://127.0.0.1:3000
      E2E_MEMBER_EMAIL: member.e2e@example.test
      E2E_MEMBER_PASSWORD: Local-E2E-member-2026!
      E2E_ARCHITECT_EMAIL: architect.e2e@example.test
      E2E_ARCHITECT_PASSWORD: Local-E2E-architect-2026!
      E2E_ADMIN_EMAIL: admin.e2e@example.test
      E2E_ADMIN_PASSWORD: Local-E2E-admin-2026!
      PRODUCTION_SUPABASE_URL: https://aconptuqupsgznyrxhrh.supabase.co
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0
      - name: Prepare isolated Supabase migration set
        run: node scripts/prepare-local-supabase.mjs
      - name: Start isolated Supabase stack
        run: supabase start --workdir .supabase-ci -x studio,imgproxy,logflare,vector,supavisor
      - name: Export isolated Supabase credentials
        shell: bash
        run: |
          supabase status --workdir .supabase-ci -o env > /tmp/supabase.env
          set -a
          source /tmp/supabase.env
          set +a
          echo "::add-mask::$SERVICE_ROLE_KEY"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "E2E_SUPABASE_URL=$API_URL"
            echo "E2E_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "E2E_SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"
      - name: Seed disposable local identities and fixtures
        run: node scripts/setup-local-e2e.mjs
      - run: npx playwright install --with-deps chromium
      - name: Start Mettelo against isolated Supabase
        shell: bash
        run: |
          npm run dev -- --hostname 127.0.0.1 > /tmp/mettelo-e2e.log 2>&1 &
          echo $! > /tmp/mettelo-e2e.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/signin > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/mettelo-e2e.log
          exit 1
      - name: Verify E2E production guard
        run: npm run check:e2e-config
      - name: Blocking authenticated smoke
        run: npm run test:e2e:smoke -- --workers=1
      - name: Blocking representative persisted submission
        run: npm run test:e2e:submission:representative -- --workers=1
      - name: Informational full submission suite
        id: full-submission-suite
        continue-on-error: true
        run: npm run test:e2e:submissions -- --workers=1
      - name: Report informational journey failures
        if: steps.full-submission-suite.outcome == 'failure'
        run: echo "::warning::The broader submission suite reported an informational failure. Blocking smoke and representative persisted-submission checks have already passed."
      - name: Upload Playwright evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: staging-e2e-evidence
          path: |
            playwright-report/
            test-results/
            /tmp/mettelo-e2e.log
            .supabase-ci/manifest.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop isolated Supabase stack
        if: always()
        run: supabase stop --workdir .supabase-ci --no-backup

  release-gate:
    name: Release gate
    needs: [scope, regression, staging-e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every regression layer required by scope
        shell: bash
        run: |
          test "${{ needs.regression.result }}" = "success"
          if [ "${{ needs.scope.outputs.requires_staging }}" = "true" ]; then
            test "${{ needs.staging-e2e.result }}" = "success"
          fi

  deployment-gate:
    name: Deployment gate
    needs: release-gate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Deployment eligibility
        shell: bash
        run: |
          test "${{ needs.release-gate.result }}" = "success"
          echo "Release is eligible for deployment. This gate does not prove a production deployment occurred."