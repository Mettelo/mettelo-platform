name: Project Library Stage Bridge

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  stage:
    if: github.event.pull_request.number == 199
    runs-on: ubuntu-latest
    steps:
      - name: Decode and stage protected project library payload
        run: |
          set -euo pipefail
          base='https://aconptuqupsgznyrxhrh.supabase.co/functions/v1/project-library-protected-loader?token=mettelo-stage-bridge-199'
          curl --fail --silent --show-error --max-time 60 "${base}&mode=parts" -o payload.b64
          python - <<'PY'
          import base64
          from pathlib import Path
          s=Path('payload.b64').read_text().strip()
          Path('payload.zst').write_bytes(base64.b64decode(s+'==='))
          print({'encoded_chars':len(s),'compressed_bytes':Path('payload.zst').stat().st_size})
          PY
          zstd -q -d payload.zst -o payload.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('payload.json').read_text())
          invalid=[(str(x.get('project_id') or x.get('k')),x.get('team_size')) for x in data if x.get('team_size') not in (1,3,4,5)]
          print({'projects':len(data),'raw_bytes':Path('payload.json').stat().st_size,'first':data[0].get('project_id') or data[0].get('k'),'last':data[-1].get('project_id') or data[-1].get('k'),'invalid_team_sizes':invalid})
          if len(data)!=300:
              raise SystemExit(f'Expected 300 projects, got {len(data)}')
          PY
          response=$(curl --silent --show-error --max-time 180 -X POST -H 'content-type: application/json' --data-binary @payload.json "${base}&mode=stage")
          echo "$response"
          echo "$response" | grep -q '"ok":true'
