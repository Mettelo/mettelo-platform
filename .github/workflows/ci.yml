name: Mettelo CI

on:
  push:
    branches:
      - main
      - 'release/**'
      - 'admin/**'
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scope:
    name: Change scope
    runs-on: ubuntu-latest
    outputs:
      requires_staging: ${{ steps.classify.outputs.requires_staging }}
      run_fast_browser: ${{ steps.classify.outputs.run_fast_browser }}
      classification: ${{ steps.classify.outputs.classification }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify release risk
        id: classify
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "push" ]; then
            before="${{ github.event.before }}"
            after="${{ github.sha }}"
            target_branch="${GITHUB_REF_NAME}"

            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
              if [[ "$target_branch" == release/* ]]; then
                echo "requires_staging=false" >> "$GITHUB_OUTPUT"
                echo "run_fast_browser=false" >> "$GITHUB_OUTPUT"
                echo "classification=release-train-integration-fast" >> "$GITHUB_OUTPUT"
                exit 0
              fi

              echo "requires_staging=true" >> "$GITHUB_OUTPUT"
              echo "run_fast_browser=false" >> "$GITHUB_OUTPUT"
              echo "classification=unscoped-main-push-full-release" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            git diff --name-only "$before" "$after" > /tmp/changed-files.txt
          else
            target_branch="${{ github.event.pull_request.base.ref }}"
            git diff --name-only \
              "${{ github.event.pull_request.base.sha }}" \
              "${{ github.event.pull_request.head.sha }}" > /tmp/changed-files.txt
          fi

          echo "Changed files:"
          cat /tmp/changed-files.txt

          if [[ "$target_branch" == release/* ]]; then
            echo "requires_staging=false" >> "$GITHUB_OUTPUT"
            echo "run_fast_browser=false" >> "$GITHUB_OUTPUT"
            if [ "${{ github.event_name }}" = "push" ]; then
              echo "classification=release-train-integration-fast" >> "$GITHUB_OUTPUT"
            else
              echo "classification=release-train-pr-fast" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          requires_staging=false
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            case "$file" in
              docs/*.md|docs/**/*.md|*.md|.github/workflows/*.yml|.github/workflows/*.yaml)
                ;;
              *)
                requires_staging=true
                break
                ;;
            esac
          done < /tmp/changed-files.txt

          if [ "$requires_staging" = "true" ]; then
            echo "requires_staging=true" >> "$GITHUB_OUTPUT"
            echo "run_fast_browser=false" >> "$GITHUB_OUTPUT"
            echo "classification=runtime-or-backend-impact" >> "$GITHUB_OUTPUT"
          else
            echo "requires_staging=false" >> "$GITHUB_OUTPUT"
            echo "run_fast_browser=true" >> "$GITHUB_OUTPUT"
            echo "classification=docs-or-ci-policy-only" >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: Fast regression gate
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SITE_URL: https://mettelo.com
      NEXT_PUBLIC_SUPABASE_URL: https://aconptuqupsgznyrxhrh.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_C5OTze0onbkbLl7Lorpjcg_FX1kDL6P
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run audit:interactions
      - run: npm run audit:regression-coverage
      - run: npm run test:project-interest-flow
      - run: npm run audit:phase0
      - run: npm run audit:phase1
      - run: npm run audit:phase2
      - run: npm run audit:phase3
      - run: npm run audit:admin
      - run: npm run audit:admin2
      - run: npm run audit:phase5-reputation
      - run: npm run audit:journey-phase6
      - run: npm run audit:journey-phase7
      - run: npm run audit:journey-phase8
      - run: npm run audit:platform-resilience
      - run: npm run audit:mettelo-lab
      - run: npm run build
      - name: Restore Playwright Chromium cache for fast regression
        if: needs.scope.outputs.run_fast_browser == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install or verify Playwright Chromium
        if: needs.scope.outputs.run_fast_browser == 'true'
        run: npx playwright install chromium
      - name: Verify Chromium launches on the hosted runner
        if: needs.scope.outputs.run_fast_browser == 'true'
        run: node -e "const { chromium } = require('@playwright/test'); (async () => { const browser = await chromium.launch(); await browser.close(); })().catch(error => { console.error(error); process.exit(1); });"
      - name: Run browser regression suite when staging is not required
        if: needs.scope.outputs.run_fast_browser == 'true'
        run: npm run test:regression
      - name: Upload interaction audit on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: interaction-audit
          path: artifacts/interaction-audit.*
          if-no-files-found: ignore
          retention-days: 3

  staging-e2e:
    name: Staging E2E - ${{ matrix.suite }}
    needs: scope
    if: needs.scope.outputs.requires_staging == 'true' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        suite:
          - public-regression
          - authenticated-qa
          - persistence
          - informational-journeys
    env:
      CI_LOCAL_SUPABASE: '1'
      E2E_BASE_URL: http://127.0.0.1:3000
      E2E_MEMBER_EMAIL: member.e2e@example.test
      E2E_MEMBER_PASSWORD: Local-E2E-member-2026!
      E2E_ARCHITECT_EMAIL: architect.e2e@example.test
      E2E_ARCHITECT_PASSWORD: Local-E2E-architect-2026!
      E2E_ADMIN_EMAIL: admin.e2e@example.test
      E2E_ADMIN_PASSWORD: Local-E2E-admin-2026!
      PRODUCTION_SUPABASE_URL: https://aconptuqupsgznyrxhrh.supabase.co
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Restore Playwright Chromium cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install or verify Playwright Chromium
        run: npx playwright install chromium
      - name: Verify Chromium launches on the hosted runner
        run: node -e "const { chromium } = require('@playwright/test'); (async () => { const browser = await chromium.launch(); await browser.close(); })().catch(error => { console.error(error); process.exit(1); });"
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0
      - name: Prepare isolated Supabase migration set
        run: node scripts/prepare-local-supabase.mjs
      - name: Start isolated Supabase stack
        run: supabase start --workdir .supabase-ci -x studio,imgproxy,logflare,vector,supavisor
      - name: Export isolated Supabase credentials
        shell: bash
        run: |
          supabase status --workdir .supabase-ci -o env > /tmp/supabase.env
          set -a
          source /tmp/supabase.env
          set +a
          echo "::add-mask::$SERVICE_ROLE_KEY"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "E2E_SUPABASE_URL=$API_URL"
            echo "E2E_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "E2E_SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"
      - name: Seed disposable local identities and fixtures
        run: node scripts/setup-local-e2e.mjs
      - name: Start Mettelo against isolated Supabase
        shell: bash
        run: |
          npm run dev -- --hostname 127.0.0.1 > /tmp/mettelo-e2e.log 2>&1 &
          echo $! > /tmp/mettelo-e2e.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/signin > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/mettelo-e2e.log
          exit 1
      - name: Verify E2E production guard
        run: npm run check:e2e-config
      - name: Chat permission preflight
        if: matrix.suite == 'public-regression'
        run: npx playwright test tests/mettelo-lab-chat-permissions.spec.ts --project=chromium --workers=1 --timeout=60000
      - name: Blocking public browser regression suite
        if: matrix.suite == 'public-regression'
        run: npm run test:regression
      - name: Blocking authenticated smoke and Mettelo Lab Chromium visual QA
        if: matrix.suite == 'authenticated-qa'
        run: npm run test:e2e:smoke -- --workers=1
      - name: Upload authenticated Chromium visuals
        if: always() && matrix.suite == 'authenticated-qa'
        uses: actions/upload-artifact@v4
        with:
          name: mettelo-lab-chromium-visuals-${{ github.run_attempt }}
          path: artifacts/mettelo-lab-visual/
          if-no-files-found: ignore
          retention-days: 7
      - name: Blocking representative persisted submission
        if: matrix.suite == 'persistence'
        run: npx playwright test tests/staging-submission-journeys.spec.ts --project=chromium --workers=1 --timeout=120000 --grep "contact, partnership, feedback and newsletter persist and reach admin operations"
      - name: Informational full submission suite
        if: matrix.suite == 'informational-journeys'
        continue-on-error: true
        run: npx playwright test tests/staging-submission-journeys.spec.ts --project=chromium --workers=1
      - name: Upload shard evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: staging-e2e-${{ matrix.suite }}-evidence-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
            artifacts/mettelo-lab-visual/
            /tmp/mettelo-e2e.log
            .supabase-ci/manifest.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop isolated Supabase stack
        if: always()
        run: supabase stop --workdir .supabase-ci --no-backup

  release-gate:
    name: Release gate
    if: always()
    needs: [scope, verify, staging-e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Require every regression layer required by scope
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          STAGING_RESULT: ${{ needs.staging-e2e.result }}
          REQUIRES_STAGING: ${{ needs.scope.outputs.requires_staging }}
          CLASSIFICATION: ${{ needs.scope.outputs.classification }}
        run: |
          set -euo pipefail

          if [ "$SCOPE_RESULT" != "success" ]; then
            echo "Release blocked: change-scope classification failed ($SCOPE_RESULT)."
            exit 1
          fi

          if [ "$VERIFY_RESULT" != "success" ]; then
            echo "Release blocked: fast regression gate=$VERIFY_RESULT."
            exit 1
          fi

          if [ "$REQUIRES_STAGING" = "true" ]; then
            if [ "$STAGING_RESULT" != "success" ]; then
              echo "Release blocked: classification=$CLASSIFICATION requires all staging matrix shards; staging=$STAGING_RESULT."
              exit 1
            fi
            echo "Release gate passed: deterministic audits/build plus parallel public, authenticated and persistence staging gates are green."
          else
            if [ "$STAGING_RESULT" != "skipped" ] && [ "$STAGING_RESULT" != "success" ]; then
              echo "Release blocked: optional staging matrix ended unexpectedly ($STAGING_RESULT)."
              exit 1
            fi
            if [[ "$CLASSIFICATION" == release-train-* ]]; then
              echo "Release-train integration gate passed. Full browser/authenticated/persistence validation remains mandatory on the final PR into main."
            else
              echo "Release gate passed: classification=$CLASSIFICATION; fast browser regression is green and backend E2E is explicitly not required by scope."
            fi
          fi

  deployment-gate:
    name: Deployment gate
    needs: [scope, release-gate]
    if: always() && needs.release-gate.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Confirm release is eligible for deployment validation
        env:
          CLASSIFICATION: ${{ needs.scope.outputs.classification }}
        run: |
          if [[ "$CLASSIFICATION" == release-train-* ]]; then
            echo "Integration branch is eligible for additional reviewed PRs. Production promotion remains blocked until the release-train PR into main passes the full release gate."
          else
            echo "All required release prerequisites passed for scope=$CLASSIFICATION."
            echo "Deployment validation/promotion may run now when deployment is required by that scope."
